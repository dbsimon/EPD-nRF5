<!-- 香港天氣功能 (Emoji + PSR數值版) -->
<script>
// ==========================================
// Shortcuts 一鍵自動化專用腳本 (完全適配現有功能)
// ==========================================
const urlParams = new URLSearchParams(window.location.search);
const autoMode = urlParams.get('mode'); // "hkwx", "calendar", "clock"
const autoConnect = urlParams.get('auto') === '1';
const targetDeviceName = urlParams.get('dev'); // 例如: ?dev=EPD-Screen1

window.addEventListener('DOMContentLoaded', () => {
    // 1. 若網址有帶 autoMode，網頁一打開就先幫你把畫面畫好
    if (autoMode) {
        // 稍微延遲一下，確保 canvas 等 DOM 已經準備好
        setTimeout(() => {
            if (autoMode === 'hkwx' && typeof setWeatherMode === 'function') {
                setWeatherMode();
            } else if (autoMode === 'calendar' && typeof syncTime1 === 'function') {
                syncTime1();
            } else if (autoMode === 'clock' && typeof syncTime2 === 'function') {
                syncTime2();
            }
        }, 500);
    }

    // 2. 如果是由 Shortcut 觸發 (auto=1) 且有指定設備名稱
    if (autoConnect && targetDeviceName) {
        // 動態產生全螢幕 UI，蓋掉後面複雜的介面
        const container = document.createElement('div');
        container.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:#f2f2f7; z-index:99999; display:flex; flex-direction:column; justify-content:center; align-items:center; font-family:-apple-system, sans-serif;";
        
        const title = document.createElement('h2');
        title.style.cssText = "margin-bottom:30px; color:#333; font-size:24px;";
        
        // 根據 mode 顯示標題
        let modeName = "畫面";
        if (autoMode === 'hkwx') modeName = "香港天氣";
        if (autoMode === 'calendar') modeName = "日曆";
        if (autoMode === 'clock') modeName = "時鐘";
        title.innerText = `準備更新: ${modeName}`;
        
        const btn = document.createElement('button');
        btn.style.cssText = "padding:25px 40px; font-size:24px; font-weight:bold; background-color:#007AFF; color:white; border:none; border-radius:16px; box-shadow:0 4px 12px rgba(0,122,255,0.3); cursor:pointer;";
        btn.innerText = `連線並更新 ${targetDeviceName}`;
        
        const status = document.createElement('p');
        status.style.cssText = "margin-top:20px; color:#666; font-size:16px; text-align:center; padding: 0 20px;";
        
        container.appendChild(title);
        container.appendChild(btn);
        container.appendChild(status);
        document.body.appendChild(container);

        // 按下按鈕的邏輯
        btn.addEventListener('click', async () => {
            btn.style.backgroundColor = '#ccc';
            btn.innerText = "處理中...";
            status.innerText = "正在呼叫藍牙...";
            
            try {
                // 因為你原版的 jsmain.js 裡面，連線是綁在 preConnect()，
                // 但 preConnect() 內部會直接呼叫 navigator.bluetooth.requestDevice
                // 我們這裡直接幫你觸發原版的連線按鈕。
                
                status.innerText = "請在彈出的視窗中選取設備...";
                
                // 這裡呼叫原版 HTML 上的連線按鈕
                if (typeof preConnect === 'function') {
                    await preConnect(); 
                } else {
                    document.getElementById('connectbutton').click();
                }

                // preConnect 是非同步的，當它執行完畢，代表設備已經連上 (或使用者取消)
                // 我們稍微等個 1.5 秒讓連線穩定
                status.innerText = "連線成功，準備發送圖片...";
                btn.style.backgroundColor = '#34C759'; // 綠色
                btn.innerText = "發送中";

                setTimeout(() => {
                    status.innerText = "正在傳輸資料，請勿關閉...";
                    
                    // 呼叫原版的發送圖片功能
                    if (typeof sendimg === 'function') {
                        sendimg();
                    } else {
                        document.getElementById('sendimgbutton').click();
                    }
                    
                    status.innerText = "指令已送出！請查看屏幕。";
                }, 1500);

            } catch (error) {
                console.error(error);
                btn.style.backgroundColor = '#FF3B30'; // 紅色
                btn.innerText = "發生錯誤";
                status.innerText = "連線取消或失敗。";
            }
        });
    }
});

	


// ---- 獲取香港天文台九天天氣預報 ----
	
const HKO_API_URL = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc';

// 1. Emoji 對照表
function getWeatherEmoji(code) {
    const c = parseInt(code);
    if (c === 50) return "晴"; 
    if (c >= 51 && c <= 53) return "短暫陽光";
    if (c === 54) return "驟雨";
    if (c >= 60 && c <= 61) return "雲";
    if (c >= 62 && c <= 63) return "雨";
	if (c >= 64 && c <= 65) return "大雨";
    if (c >= 70 && c <= 77) "月";
    if (c === 80) return "大風"; 
	if (c === 81) return "乾燥"; 
	if (c === 82) return "潮濕"; 
	if (c === 83) return "霧"; 
	if (c === 84) return "薄霧"; 
	if (c === 85) return "煙霞"; 
	if (c === 90) return "熱"; 
	if (c === 91) return "暖"; 
	if (c === 92) return "涼"; 
	if (c === 93) return "冷"; 
    return "❓";
}

// 2. PSR (降雨概率) 簡寫轉換

function getShortPSR(psrText) {
    if (!psrText) return "-";
    const t = psrText.toLowerCase();
    if (t.includes("high") || t.includes("高")) return "H";
    if (t.includes("medium") || t.includes("中")) {
        if (t.includes("low") || t.includes("低")) return "ML";
        if (t.includes("high") || t.includes("高")) return "MH";
        return "M";
    }
    if (t.includes("low") || t.includes("低")) return "L";
    return t;
}

async function setWeatherMode() {
    const canvasEl = document.querySelector('canvas');
    if (!canvasEl) { alert('Canvas element not found'); return; }
    const ctx = canvasEl.getContext('2d');
    
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
    ctx.fillStyle = 'black';
    ctx.font = '30px Arial';
    ctx.fillText("Loading...", 10, 50);
    if (typeof render === 'function') render();

    try {
        const response = await fetch(HKO_API_URL);
        const data = await response.json();
        
        const now = new Date();
        const todayStr = now.getFullYear() + 
                        (now.getMonth()+1).toString().padStart(2, '0') + 
                        now.getDate().toString().padStart(2, '0');
        
        let startIndex = data.weatherForecast.findIndex(item => item.forecastDate === todayStr);
        if (startIndex === -1) startIndex = 0; 

        const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
        const updateTime = now.toLocaleString('zh-HK', {
            month: '2-digit', day: '2-digit', 
            hour: '2-digit', minute: '2-digit', hour12: false
        });

        // Clear
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
        ctx.fillStyle = 'black';
        
        // Title
        ctx.font = `bold ${Math.floor(canvasEl.width / 16)}px Arial`;
        ctx.fillText("香港天氣 (3 Days)", 10, 40);
        ctx.fillRect(10, 50, canvasEl.width - 20, 2);

        const startY = 90;
        const rowHeight = 65;

        for (let i = 0; i < 3; i++) {
            const dayData = data.weatherForecast[startIndex + i];
            if (!dayData) break;

            const y = dayData.forecastDate.substring(0,4);
            const m = dayData.forecastDate.substring(4,6);
            const d = dayData.forecastDate.substring(6,8);
            const dateObj = new Date(`${y}-${m}-${d}`);
            const dateText = `${parseInt(m)}/${parseInt(d)}(${weekDays[dateObj.getDay()]})`; // 去掉空格更緊湊

            const tempStr = `${dayData.forecastMintemp.value}-${dayData.forecastMaxtemp.value}°`; // 去掉C更簡潔
            const emoji = getWeatherEmoji(dayData.ForecastIcon);
            const psrVal = getShortPSR(dayData.PSR);
            
            const currentY = startY + (i * rowHeight);

            // 1. 日期 (最左)
            ctx.font = `bold ${Math.floor(canvasEl.width / 14)}px Arial`;
            ctx.fillText(dateText, 10, currentY);
            
            // 獲取日期文字寬度，以便緊接著畫 Emoji
            const dateWidth = ctx.measureText(dateText).width;

            // 2. Emoji (緊接日期右邊 + 10px 間距)
            ctx.font = `${Math.floor(canvasEl.width / 14)}px Arial`; 
            ctx.fillText(emoji, 10 + dateWidth + 10, currentY); 

            // 3. 溫度 (最右邊，特大字體)
            // 先設定字體以計算寬度
            ctx.font = `bold ${Math.floor(canvasEl.width / 11)}px Arial`; // 字體加大到 1/11 寬度
            const tempWidth = ctx.measureText(tempStr).width;
            ctx.fillText(tempStr, canvasEl.width - tempWidth - 5, currentY);

            // 4. PSR (溫度左邊，小字體)
            ctx.font = `${Math.floor(canvasEl.width / 24)}px Arial`;
            const psrText = `PSR:${psrVal}`;
            const psrWidth = ctx.measureText(psrText).width;
            // 畫在溫度的左邊
            ctx.fillText(psrText, canvasEl.width - tempWidth - psrWidth - 15, currentY);
        }

        // Footer
        ctx.font = `${Math.floor(canvasEl.width / 28)}px Arial`;
        ctx.fillText(`Updated: ${updateTime}`, 10, canvasEl.height - 10);

        if (typeof render === 'function') render();
        else if (typeof update === 'function') update();

    } catch (e) {
        console.error(e);
        ctx.fillText("Load Failed", 10, 50);
    }
}
</script>
